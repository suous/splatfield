[package]
name = "splat-sort"
version.workspace = true
edition.workspace = true

[features]
# Test-only GPU test client for workspace crates' test builds — gated out of
# production builds.
test-utils = []

[dependencies]
cubecl.workspace = true
bytemuck.workspace = true

[dev-dependencies]
rand.workspace = true
criterion.workspace = true

# criterion 0.6+ ships its own harness; the libtest harness runs zero benches.
[[bench]]
name = "radix_sort"
harness = false
