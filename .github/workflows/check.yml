name: check
permissions:
  contents: read
on:
  push:
    branches: [roadmap/06_wasm]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pin from jonhoo/rust-ci-conf)
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo doc
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  test:
    # The sort kernel requires subgroup (plane) ops, which lavapipe (the
    # software Vulkan on ubuntu runners) lacks; Apple Silicon/Metal has
    # them. See crates/sort plane_sort_path.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pin from jonhoo/rust-ci-conf)
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - name: Fetch test fixtures (release-hosted; gitignored)
        run: |
          base=https://github.com/suous/splatfield/releases/download/fixtures-v1
          mkdir -p data
          curl -fsSL --retry 3 -o data/SHA256SUMS "$base/SHA256SUMS"
          for f in bear.3d71a266.sog bear.3d71a266_sh1.sog bear.3d71a266_sh2.sog bus.jpg; do
            curl -fsSL --retry 3 -o "data/$f" "$base/$f"
          done
          (cd data && sha256sum -c SHA256SUMS)
      - name: Restore the model release (models-v1)
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # gsam's models_dir() follows the platform cache convention,
          # which is ~/Library/Caches (not ~/.cache) on macOS.
          path: ~/Library/Caches/splatfield/models
          key: models-v1
      - name: Download models-v1 on cache miss
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o /tmp/splatfield-models.zip \
            https://github.com/suous/splatfield/releases/download/models-v1/splatfield-models.zip
          # file arg, not stdin: the macOS sha256sum shim reads check
          # lists only from files
          echo "259ed2a989fc368b839cb32c1b43c758fa1207e4849123e603f83baedb35f740  /tmp/splatfield-models.zip" > /tmp/models.sha256
          sha256sum -c /tmp/models.sha256
          mkdir -p /tmp/models-stage ~/Library/Caches/splatfield/models
          unzip -q /tmp/splatfield-models.zip -d /tmp/models-stage
          mv /tmp/models-stage/models ~/Library/Caches/splatfield/models/models-v1
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast
