name: Deploy

on:
  push:
    branches: [roadmap/06_wasm]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MODELS_URL: https://github.com/suous/splatfield/releases/download/models-v1/splatfield-models.zip
  DEMO_SCENE_URL: https://github.com/suous/splatfield/releases/download/fixtures-v1/bear.3d71a266_sh1.sog

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pin from jonhoo/rust-ci-conf)

      # The release identity the app pins is single-sourced in src/fetch.rs
      # (ZIP_SHA256/ZIP_BYTES) over gsam::RELEASE_TAG's asset. Parse it out
      # below so CI and the binary can never disagree — drift fails the
      # deploy instead of the user's first segmentation click.
      - name: Derive the pinned models identity from src/fetch.rs
        run: |
          sha="$(sed -n 's/^pub const ZIP_SHA256: &str = "\(.*\)";$/\1/p' src/fetch.rs)"
          bytes="$(sed -n 's/^pub const ZIP_BYTES: u64 = \(.*\);$/\1/p' src/fetch.rs | tr -d '_')"
          test -n "$sha"
          test -n "$bytes"
          echo "MODELS_SHA256=$sha" >> "$GITHUB_ENV"
          echo "MODELS_BYTES=$bytes" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      # index.html's data-wasm-opt links are load-bearing for release size;
      # trunk silently skips optimization when the binary is absent.
      - run: sudo apt-get update && sudo apt-get install -y binaryen

      # Pinned to the version the app's data-* attributes (worker loader
      # shim, wasm-opt params) are validated against.
      - run: cargo binstall --no-confirm trunk@0.21.14

      # Project Pages serves the app under /<repo>/; the same subpath is
      # baked into index.html's <base> and every asset reference.
      - run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - run: trunk build --release --public-url "$BASE_PATH"

      - name: Ship the models zip as parts + the demo scene
        run: bash scripts/ship_models.sh dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - run: trunk build --release --public-url "/"

      - name: Ship the models zip as parts + the demo scene (mirror)
        run: bash scripts/ship_models.sh dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edgeone-dist
          path: dist

  deploy-edgeone:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard on the EdgeOne API token
        id: guard
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "EDGEONE_API_TOKEN not configured — skipping the EdgeOne mirror deploy"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edgeone-dist
          path: dist
      - if: steps.guard.outputs.skip != 'true'
        name: Deploy the mirror to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          # Version-pinned: the token rides this process's environment, so
          # an arbitrary @latest npm install is a supply-chain surface.
          npx -y edgeone@1.6.41 makers deploy dist -n splatfield -t "$EDGEONE_API_TOKEN" --json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
