name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only_target:
        description: "Build only this matrix target (e.g. x86_64-unknown-linux-gnu); empty = all"
        default: ""
      release_tag:
        description: "Existing tag whose release gets the rebuilt assets (e.g. v0.2.0-rc.1); empty = do not publish"
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  # Emit the build matrix: all targets, or just the one named by a
  # dispatch's only_target input.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          ONLY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.only_target || '' }}
        run: |
          case "$ONLY_TARGET" in
            "") matrix='[{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"}]' ;;
            x86_64-pc-windows-msvc) matrix='[{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]' ;;
            x86_64-unknown-linux-gnu) matrix='[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]' ;;
            aarch64-apple-darwin) matrix='[{"os":"macos-latest","target":"aarch64-apple-darwin"}]' ;;
            *) echo "unknown only_target: $ONLY_TARGET" >&2; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    # ubuntu-22.04 is pinned, not ubuntu-latest: 24.04+ (glibc >= 2.38,
    # gcc 13 C23 mode) bakes __isoc23_* / GLIBC_2.38+ requirements into
    # the binary, locking out Ubuntu 22.04 / Debian 12 users. 22.04 keeps
    # the floor at glibc 2.35. Also shields from ubuntu-latest migrations.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pin from jonhoo/rust-ci-conf)

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xfixes0-dev libxcb1-dev libxkbcommon-dev libx11-dev libwayland-dev

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../splatfield-${{ matrix.target }}.zip splatfield.exe

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../splatfield-${{ matrix.target }}.tar.gz splatfield

      - uses: actions/upload-artifact@v7
        with:
          name: splatfield-${{ matrix.target }}
          path: splatfield-${{ matrix.target }}.*

  release:
    needs: build
    # tag push (publish new release) or dispatch with an explicit target release
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts/

      # dispatch path: clobber same-named assets on an existing release
      - name: Upload to existing release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" artifacts/* --clobber

      - uses: softprops/action-gh-release@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          files: artifacts/*
          generate_release_notes: true
          # rc/beta tags (v0.2.0-rc.1) publish as prerelease; plain tags (v0.2.0) as stable
          prerelease: ${{ contains(github.ref, '-') }}
