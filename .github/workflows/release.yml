name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # NOTE: ubuntu-latest (24.04+, glibc >= 2.38) because the prebuilt
          # ONNX Runtime static lib (ort download-binaries) references
          # __isoc23_strtol/strtoll/strtoull (2.38) and pidfd_* (2.39); linking
          # on 22.04 fails. The Linux binary therefore requires glibc >= 2.39
          # (Ubuntu 24.04+). Revisit with a shim or vendored ORT build.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pin from jonhoo/rust-ci-conf)

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xfixes0-dev libxcb1-dev libxkbcommon-dev libx11-dev libwayland-dev

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../splatfield-${{ matrix.target }}.zip splatfield.exe

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../splatfield-${{ matrix.target }}.tar.gz splatfield

      - uses: actions/upload-artifact@v7
        with:
          name: splatfield-${{ matrix.target }}
          path: splatfield-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts/

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          # rc/beta tags (v0.2.0-rc.1) publish as prerelease; plain tags (v0.2.0) as stable
          prerelease: ${{ contains(github.ref, '-') }}
