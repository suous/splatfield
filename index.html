<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <base data-trunk-public-url />
    <title>SplatField</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link data-trunk rel="copy-file" path="favicon.svg" href="favicon.svg" />
    <link data-trunk rel="rust" data-wasm-opt="2" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Helvetica, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div class="centered" id="loading_text">
        <p>Loading SplatField...</p>
    </div>
    <script>
        setTimeout(() => {
            const el = document.getElementById("loading_text");
            if (el) el.remove();
        }, 3000);
    </script>
</body>
</html>
