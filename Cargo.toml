[package]
name = "splatfield"
version = "0.1.3"
edition = "2024"

[dependencies]
cubecl = { version = "0.10.0", features = ["wgpu"] }
bytemuck = "1.25"
glam = "0.33"
egui = "0.35"
wgpu = "29"
anyhow = "1.0.102"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["wgpu", "x11", "wayland"] }
pollster = "0.4"
env_logger = "0.11.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cubecl-common = { version = "0.10.0", features = ["serde"] }
eframe = { version = "0.35", features = ["wgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Document", "Element", "Window"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
rand = "0.10"
criterion = "0.5"

[[bench]]
name = "radix_sort"
harness = false

[profile.release]
lto = true
opt-level = 's'
codegen-units = 1
panic = "abort"
