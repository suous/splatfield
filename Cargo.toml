[workspace]
members = ["crates/sort"]

[workspace.package]
version = "0.1.4"
edition = "2024"

[workspace.dependencies]
# default-features off skips cubecl's unused stdlib helpers (views, quant,
# FastDivmod). exclusive-memory-only lets read-only args bind as
# `storage, read` instead of read_write; without it the WGSL uniformity
# analysis rejects barrier loops bounded by a loaded value — e.g. the
# rasterizer's per-tile intersection ranges.
cubecl = { version = "=0.11.0-pre.3", default-features = false, features = ["wgpu", "exclusive-memory-only"] }
bytemuck = "1.25"
rand = "0.10"
criterion = "0.8"

[package]
name = "splatfield"
version.workspace = true
edition.workspace = true

[dependencies]
cubecl.workspace = true
bytemuck.workspace = true
glam = "0.33"
anyhow = "1.0.104"
image = { version = "0.25", default-features = false, features = ["webp"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
splat-sort = { path = "crates/sort" }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "render_frame"
harness = false

[profile.release]
lto = "thin"
opt-level = 'z'
codegen-units = 1
panic = "abort"
strip = true

